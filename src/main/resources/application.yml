server:
  port: ${PORT:9443}

spring:
  application:
    name: smt-service
  datasource:
    url: jdbc:h2:mem:fixinh;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

smt:
  security:
    service-token: ${SMP_SERVICE_TOKEN:local-integration-token}
  cors:
    allowed-origin: ${SMT_CORS_ALLOWED_ORIGIN:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:fixinh_smt}
    username: ${POSTGRES_USER:fixinh}
    password: ${POSTGRES_PASSWORD:fixinh-dev}