services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixinh_smt}
      POSTGRES_USER: ${POSTGRES_USER:-fixinh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixinh-dev}
    ports:
      - "5432:5432"
    volumes:
      - smt-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  smt-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fixinh_smt}
      POSTGRES_USER: ${POSTGRES_USER:-fixinh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixinh-dev}
      SMP_SERVICE_TOKEN: ${SMP_SERVICE_TOKEN:-local-integration-token}
    ports:
      - "9443:9443"

volumes:
  smt-postgres:
